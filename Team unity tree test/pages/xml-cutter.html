<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.XML Cutter</title>
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('sprite-cutter-theme');
          const theme = savedTheme === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="../assets/style.css?v=3" />
    <script src="../assets/auth-system.js"></script>
    <script src="../assets/auth-gate.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">Unity Sprite Cutter</div>
        <nav>
          <a href="../index.html">Home</a>
          <a href="sprite-cutter.html">Sprite Sheet</a>
          <a href="xml-cutter.html">.XML Cutter</a>
          <a href="meta-cutter.html">Meta Cutter</a>
          <a href="rgb-dumper.html">RGB Dumper</a>
        </nav>
        <div class="theme-switcher" aria-label="Theme switcher" data-theme-switcher>
          <button class="theme-toggle" type="button" data-theme-option="light" aria-pressed="false">Light</button>
          <button class="theme-toggle is-active" type="button" data-theme-option="dark" aria-pressed="true">Dark</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="utility-actions">
        <a class="button secondary" href="../auth-login.html">Login</a>
        <a class="button secondary" href="../auth-admin.html?from=xml" id="admin-link" hidden>Admin Panel</a>
      </div>
      <div class="page-header">
        <p class="eyebrow">.XML Cutter</p>
        <h1>Cut sprites based on .XML files</h1>
      </div>

      <div class="workspace">
        <section class="panel">
          <form id="xml-form">
            <label>
              Spritesheet image(s)
              <input id="xml-sheet-file" type="file" accept="image/*" multiple />
            </label>

            <label>
              .XML file(s)
              <input id="xml-atlas-file" type="file" accept=".xml,text/xml" multiple />
            </label>

            <label class="checkbox-row">
              <input id="xml-split-eye-sprites" type="checkbox" />
              Optional: split eye/lid sprites into left and right
            </label>

            <div class="action-group">
              <button class="button primary" type="submit">Export Sprites</button>
            </div>

            <div id="xml-selected-files" class="status"></div>
            <div id="status" class="status"></div>
          </form>
        </section>

        <section class="panel">
          <h2>Source image preview</h2>
          <div id="xml-preview" class="preview-box">
            <p>Choose a spritesheet image to preview it before adding an XML file.</p>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="../assets/auth-system.js"></script>
    <script src="../assets/auth-gate.js"></script>
    <script>
      function checkAdminAccess() {
        if (typeof AuthManager === 'undefined') {
          setTimeout(checkAdminAccess, 100);
          return;
        }

        const currentUser = AuthManager.getSessionUser();
        const adminLink = document.getElementById('admin-link');
        
        if (currentUser) {
          const user = AuthManager.getUser(currentUser);
          if (user && user.isAdmin) {
            adminLink.style.display = 'inline-block';
          }
        }
      }

      checkAdminAccess();
    </script>
    <script src="../assets/xml-crop.js"></script>
    <script src="../assets/app.js"></script>
  </body>
</html>
